name = "drivenglish-com"   # musí sedět s názvem Workeru v dashboardu (Workers Builds)
main = "src/worker.js"
compatibility_date = "2025-10-01"
# Worker je dostupný jen přes custom doménu za Cloudflare Access.
workers_dev = false

# Workers Logs — console.log/error z Workeru v dashboardu (Observability)
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "drivenglish"
database_id = "ff721eaf-84ac-4702-a72c-3584386da817"
migrations_dir = "migrations"

[vars]
TRIAL_DAYS = "30"
# Z Zero Trust → Access → Applications → <app> → Overview
ACCESS_TEAM_DOMAIN = "marek-kudlacek.cloudflareaccess.com"
ACCESS_AUD = "7de51e534b4e1d21cbd3fb762bd08c3eebbd45977a185587f10b0620f28b27eb"
# Pouze pro `wrangler dev` — nastav v .dev.vars, NIKDY ne v produkci:
# DEV_USER_EMAIL = "you@example.com"
